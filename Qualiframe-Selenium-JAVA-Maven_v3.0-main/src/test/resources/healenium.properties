# Healenium Configuration Properties
# This file configures Healenium self-healing test automation

# Number of recovery attempts when a locator fails
# Default: 1
recovery-tries=1

# Score cap for element matching (0.0 to 1.0)
# Higher values mean stricter matching
# Default: 0.6
score-cap=0.6

# Enable/disable healing functionality
# Default: true
heal-enabled=true

# Healenium backend server URL
# Default: http://localhost:7878
# Note: This can be overridden by HealeniumBackendUrl in Global Settings.properties
hlm.server.url=http://localhost:7878

# Healenium selector-imitator URL (optional, for advanced features)
# Default: http://localhost:8000
hlm.imitator.url=http://localhost:8000

# Page URL for healing (optional)
# Leave empty to use current page URL
page-url=

# Imitator timeout in milliseconds
# Default: 30000 (30 seconds)
imitator-timeout=30000

# Base URL for Healenium backend API
# Default: http://localhost:7878
base-url=http://localhost:7878

