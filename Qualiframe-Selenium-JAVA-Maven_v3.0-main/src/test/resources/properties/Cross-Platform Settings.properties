# CROSS-PLATFORM SETTINGS
# This file contains platform-agnostic configurations for Windows, macOS, and Linux
# Generated by QualiFrameV2 Cross-Platform Compatibility Tool

#-------------------------------------------------------------------------------
# PLATFORM DETECTION
#-------------------------------------------------------------------------------
# These settings are automatically detected based on the operating system
# Windows: os.name contains "win"
# macOS: os.name contains "mac" 
# Linux: os.name contains "nux" or "nix"

#-------------------------------------------------------------------------------
# FILE SYSTEM SETTINGS
#-------------------------------------------------------------------------------
# Cross-platform file separators and paths
FileSeparator=${file.separator}
PathSeparator=${path.separator}
UserHome=${user.home}
TempDirectory=${java.io.tmpdir}
DownloadDirectory=${user.home}${file.separator}Downloads
DriverDirectory=${java.io.tmpdir}${file.separator}webdrivers

#-------------------------------------------------------------------------------
# BROWSER BINARY PATHS (Auto-detected)
#-------------------------------------------------------------------------------
# Chrome paths
ChromeWindowsPath=C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe
ChromeMacPath=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome
ChromeLinuxPath=/usr/bin/google-chrome

# Firefox paths
FirefoxWindowsPath=C:\\Program Files\\Mozilla Firefox\\firefox.exe
FirefoxMacPath=/Applications/Firefox.app/Contents/MacOS/firefox
FirefoxLinuxPath=/usr/bin/firefox

# Edge paths
EdgeWindowsPath=C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe
EdgeMacPath=/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
EdgeLinuxPath=/usr/bin/microsoft-edge

#-------------------------------------------------------------------------------
# MOBILE APP PATHS (Cross-platform)
#-------------------------------------------------------------------------------
# Android app paths - use relative paths from project root
AndroidAppPath=src${file.separator}test${file.separator}resources${file.separator}mobile${file.separator}android${file.separator}app.apk
AndroidAppPathWindows=C:\\Users\\${user.name}\\Documents\\MobileApps\\app.apk
AndroidAppPathMac=${user.home}${file.separator}Documents${file.separator}MobileApps${file.separator}app.apk
AndroidAppPathLinux=${user.home}${file.separator}Documents${file.separator}MobileApps${file.separator}app.apk

# iOS app paths - use relative paths from project root
iOSAppPath=src${file.separator}test${file.separator}resources${file.separator}mobile${file.separator}ios${file.separator}app.ipa
iOSAppPathMac=${user.home}${file.separator}Documents${file.separator}MobileApps${file.separator}app.ipa

#-------------------------------------------------------------------------------
# APPIUM SETTINGS (Cross-platform)
#-------------------------------------------------------------------------------
# Appium server URL - works on all platforms
AppiumURL=http://127.0.0.1:4723/wd/hub
AppiumURLWindows=http://127.0.0.1:4723/wd/hub
AppiumURLMac=http://127.0.0.1:4723/wd/hub
AppiumURLLinux=http://127.0.0.1:4723/wd/hub

#-------------------------------------------------------------------------------
# CLOUD PLATFORM SETTINGS (Platform-agnostic)
#-------------------------------------------------------------------------------
# SauceLabs - works on all platforms
SauceLabsHost=https://ondemand.us-west-1.saucelabs.com:443/wd/hub
SauceLabsMobileHost=https://ondemand.us-west-1.saucelabs.com:443/wd/hub

# LambdaTest - works on all platforms
LambdaTestWebHost=https://hub.lambdatest.com/wd/hub
LambdaTestMobileHost=https://mobile-hub.lambdatest.com/wd/hub

# BrowserStack - works on all platforms
BrowserStackHost=https://hub-cloud.browserstack.com/wd/hub

#-------------------------------------------------------------------------------
# WINDOWS APPLICATION SETTINGS
#-------------------------------------------------------------------------------
# Windows-specific settings (only used on Windows)
WindowsAppPath=C:\\Windows\\System32\\notepad.exe
WindowsMachineURL=http://127.0.0.1
WindowsMachinePort=4723
WindowsPlatformName=Windows
WindowsDeviceName=WindowsPC
WindowsDriverPath=C:\\Program Files (x86)\\Windows Application Driver

#-------------------------------------------------------------------------------
# CROSS-PLATFORM EXECUTION MODES
#-------------------------------------------------------------------------------
# Execution modes that work across platforms
SupportedExecutionModes=LOCAL,GRID,SAUCELABS,LAMBDATEST,BROWSERSTACK,AWSDEVICEFARM,PERFECTO,API
PlatformSpecificModes=WINDOWS

#-------------------------------------------------------------------------------
# PLATFORM-SPECIFIC CAPABILITIES
#-------------------------------------------------------------------------------
# Chrome options that work across platforms
ChromeOptions=--ignore-certificate-errors,--test-type,--disable-extensions,--disable-infobars,--disable-save-password-bubble,--disable-gpu,--enable-geolocation,--start-maximized,--disable-notifications,--disable-component-update,--remote-allow-origins=*,--no-sandbox,--disable-dev-shm-usage,--disable-blink-features=AutomationControlled

# Firefox options that work across platforms
FirefoxOptions=--start-maximized

# Edge options that work across platforms
EdgeOptions=--start-maximized,--disable-notifications,--disable-blink-features=AutomationControlled

#-------------------------------------------------------------------------------
# MOBILE CAPABILITIES (Cross-platform)
#-------------------------------------------------------------------------------
# Android capabilities
AndroidCapabilities=platformName=Android,automationName=UiAutomator2,noReset=true,fullReset=false,autoGrantPermissions=true

# iOS capabilities
iOSCapabilities=platformName=iOS,automationName=XCUITest,noReset=true,fullReset=false,autoGrantPermissions=true

#-------------------------------------------------------------------------------
# API TESTING SETTINGS (Platform-agnostic)
#-------------------------------------------------------------------------------
# REST Assured settings that work on all platforms
RestAssuredBaseURL=http://dummy.restapiexample.com/api/v1/
RestAssuredTimeout=30000
RestAssuredConnectionTimeout=10000
RestAssuredReadTimeout=30000

#-------------------------------------------------------------------------------
# REPORTING SETTINGS (Cross-platform)
#-------------------------------------------------------------------------------
# Report paths that work on all platforms
ReportPath=Results${file.separator}${current.date}
ScreenshotPath=Results${file.separator}${current.date}${file.separator}screenshots
LogPath=logs${file.separator}${current.date}

#-------------------------------------------------------------------------------
# PERFORMANCE SETTINGS (Cross-platform)
#-------------------------------------------------------------------------------
# Performance monitoring settings
PerformanceMonitoring=true
MemoryMonitoring=true
CPUMonitoring=true
NetworkMonitoring=true

#-------------------------------------------------------------------------------
# SECURITY SETTINGS (Cross-platform)
#-------------------------------------------------------------------------------
# Security settings that work on all platforms
SecurityScanning=true
VulnerabilityScanning=true
SSLVerification=true
CertificateValidation=true

#-------------------------------------------------------------------------------
# DEBUGGING SETTINGS (Cross-platform)
#-------------------------------------------------------------------------------
# Debug settings that work on all platforms
DebugMode=false
VerboseLogging=false
ScreenshotOnFailure=true
ScreenshotOnSuccess=false
VideoRecording=false

#-------------------------------------------------------------------------------
# PLATFORM DETECTION HELPERS
#-------------------------------------------------------------------------------
# These properties help detect the current platform
CurrentPlatform=${os.name}
CurrentArchitecture=${os.arch}
CurrentJavaVersion=${java.version}
CurrentJavaHome=${java.home}
CurrentUser=${user.name}
CurrentWorkingDirectory=${user.dir}